# local_internal_options.conf
#
# This file should be handled with care. It contains
# run time modifications that can affect the use
# of OSSEC. Only change it if you know what you
# are doing. Look first at gsmsec.conf
# for most of the things you want to change.
#
# This file will not be overwritten during upgrades
# but will be removed when the agent is un-installed.

# Allow the manager's shared agent.conf to run <wodle name="command"> commands.
# REQUIRED for the ransomware defense (guardsarm-ransom-guard / guardsarm-snapshot-
# provision are pushed via the group agent.conf); without it the agent silently
# refuses those commands. The Linux/macOS packages enable this in inst-functions.sh;
# the Windows MSI ships it here so new installs get the defense out of the box.
guardsarm_command.remote_commands=1
